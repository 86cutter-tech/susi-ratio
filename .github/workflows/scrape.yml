name: 수시 경쟁률 수집

on:
  schedule:
    - cron: "*/5 23,0-14 * 9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: 결과 커밋
        run: |
          git config user.name "ratio-bot"
          git config user.email "ratio-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
